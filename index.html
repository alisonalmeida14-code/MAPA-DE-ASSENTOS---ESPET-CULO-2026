<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Assentos — Espetáculo de Dança | Anchor</title>
<style>
  :root{
    --bg:#05060c; --bg2:#0d1230; --card:#12162a; --ink:#f0ece0; --muted:#9a97a6;
    --gold:#d4af6a; --gold-light:#ecd9a8; --blue:#3a9bca;
    --avail:#3a785c; --reserved:#b08c3c; --sold:#963c3a;
    --pref:#3a9bca; --pref-b:#6cc0e8; --extra:#5a5a63; --extra-b:#8a8a94;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg);}
  #app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(115deg, var(--bg) 0%, var(--bg) 45%, var(--bg2) 100%);
    color:var(--ink); padding:16px 6px 30px;
    max-width:560px; margin:0 auto; min-height:100vh;
  }
  .logo-wrap{ display:flex; justify-content:center; margin-bottom:6px; }
  .logo-wrap img{ height:64px; width:auto; filter:drop-shadow(0 0 6px rgba(212,175,106,.25)); }
  h1{ font-size:16px; text-align:center; margin:0 0 3px; letter-spacing:.5px; }
  h2{ font-size:12px; font-style:italic; font-weight:500; text-align:center; color:var(--gold-light); margin:0 0 3px; }
  .brand{ text-align:center; font-size:10.5px; color:var(--blue); margin-bottom:14px; }
  .tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--card); padding:4px; border-radius:10px; border:1px solid #262b38; }
  .tab{ flex:1; text-align:center; padding:9px 4px; border-radius:7px; font-size:13px; font-weight:700; color:var(--muted); background:transparent; border:none; }
  .tab.active{ background:var(--gold); color:#1a1508; }
  .stage{ background:linear-gradient(180deg,var(--gold),#a9863f); color:#1a1508; text-align:center; padding:11px 8px; border-radius:4px 4px 36px 36px / 4px 4px 16px 16px; font-weight:800; letter-spacing:6px; font-size:12px; margin-bottom:14px; }
  .summary{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); margin-bottom:12px; }
  .summary b{color:var(--ink);}
  .section-label{ text-align:center; font-size:12px; font-weight:800; letter-spacing:2px; color:var(--gold-light); margin:12px 0 8px; }
  .divider{ border:none; border-top:1px solid #262b38; margin:14px 0; }
  #seatmap-plateia{ display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
  .row{ display:flex; align-items:center; gap:5px; }
  .row.centered{ justify-content:center; }
  .row-pair{ display:flex; justify-content:space-between; align-items:center; }
  .row-label{ width:18px; text-align:center; font-weight:700; font-size:10px; color:var(--gold); flex-shrink:0; }
  .seats{ display:flex; gap:2.5px; }
  .seat{ width:17px; height:16px; border-radius:3px; border:none; font-size:7px; font-weight:700; color:#f4f4f4; background:var(--avail); box-shadow:0 1px 0 rgba(0,0,0,.25) inset; padding:0; -webkit-tap-highlight-color:transparent; }
  .seat.reservado{background:var(--reserved); color:#1a1508;}
  .seat.vendido{background:var(--sold);}
  .seat.pref{background:var(--pref); outline:1px solid var(--pref-b); outline-offset:-1px;}
  .seat.extra{background:var(--extra); outline:1px solid var(--extra-b); outline-offset:-1px;}
  .seat.extra.reservado{background:var(--reserved);}
  .seat.extra.vendido{background:var(--sold);}
  .editing .seat{cursor:pointer;}
  .editing .seat:active{transform:scale(.9);}
  .note-line{ text-align:center; font-size:10px; color:var(--gold-light); margin:6px 0 4px; }
  .legend{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px 12px; font-size:10.5px; margin:14px 0 16px; }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .controls{ background:var(--card); border:1px solid #262b38; border-radius:10px; padding:12px; margin-bottom:14px; }
  .controls button{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--gold); background:transparent; color:var(--gold); font-weight:700; font-size:13px; }
  .controls.on button{ background:var(--gold); color:#1a1508; }
  .status-line{ text-align:center; font-size:11px; color:var(--muted); margin-top:8px; }
  .disclaimer{ font-size:9.5px; color:var(--muted); text-align:center; line-height:1.5; padding:0 4px; }
  .panel-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .panel{ background:#181c26; color:var(--ink); width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:18px; border-top:1px solid var(--gold); }
  .panel h3{margin:0 0 4px; font-size:16px; color:var(--gold-light);}
  .panel .sub{color:var(--muted); font-size:12px; margin-bottom:12px;}
  .panel label{display:block; font-size:11px; color:var(--muted); margin:10px 0 3px;}
  .panel input, .panel select{ width:100%; padding:9px; border-radius:8px; border:1px solid #333a48; background:#0f1219; color:var(--ink); font-size:14px; }
  .panel-actions{display:flex; gap:8px; margin-top:16px;}
  .panel-actions button{ flex:1; padding:11px; border-radius:8px; border:none; font-weight:700; font-size:13px; }
  .btn-save{background:var(--gold); color:#1a1508;}
  .btn-cancel{background:#2a2f3b; color:#ccc;}
  .mez-wrap{ display:flex; justify-content:center; align-items:flex-start; gap:14px; margin-bottom:6px; }
  .mez-arm{ display:flex; flex-direction:column; gap:4px; align-items:center; }
  .mez-arm-label{ font-weight:700; font-size:10px; color:var(--gold); margin-bottom:2px; }
  .mez-base{ display:flex; flex-direction:column; gap:4px; }
  .loading{ text-align:center; padding:40px 10px; color:var(--muted); font-size:13px; }
  .lot-banner{
    text-align:center; margin:0 0 14px; padding:10px 12px;
    border:1px solid var(--gold); border-radius:10px;
    background:rgba(212,175,106,.08);
  }
  .lot-banner .lot-name{ color:var(--gold-light); font-weight:800; font-size:13px; letter-spacing:.5px; }
  .lot-banner .lot-price{ color:var(--gold); font-weight:800; font-size:20px; margin-left:6px; }
  .lot-table{ width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }
  .lot-table th, .lot-table td{ padding:4px 6px; border-bottom:1px solid #262b38; color:var(--muted); text-align:center; }
  .lot-table th{ color:var(--gold-light); font-weight:700; }
  .lot-table tr.current td{ color:var(--ink); font-weight:700; }
  .composicao{ font-size:10px; color:var(--muted); text-align:center; line-height:1.6; margin-top:10px; }
  .info-buttons{ display:flex; gap:8px; margin-bottom:14px; }
  .info-buttons button{
    flex:1; padding:10px 6px; border-radius:8px; border:1px solid var(--gold);
    background:transparent; color:var(--gold-light); font-weight:700; font-size:11.5px;
  }
  .about-panel{ background:#181c26; }
  .about-panel img{ width:100%; border-radius:10px; margin-bottom:12px; display:block; }
  .about-panel h3{ font-size:18px; color:var(--gold-light); margin:0 0 2px; text-align:center; }
  .about-panel .sub{ text-align:center; margin-bottom:10px; }
  .about-panel .synopsis{ font-size:13px; line-height:1.6; color:var(--ink); margin-bottom:10px; }
  .about-panel .meta{ font-size:12.5px; color:var(--gold-light); text-align:center; font-weight:700; margin-bottom:14px; }
</style>
</head>

  function seatKey(l,i){ return l+"-"+i; }

  function defaultData(seed){
    var d = {};
    PLATEIA.forEach(function(r){ for (var i=1;i<=r[4];i++){ d[seatKey(r[0],i)] = {status:"disponivel"}; } });
    ["O","Q"].forEach(function(letter){
      var def = OQ_DEF[letter];
      for (var i=1;i<=def[1];i++){ d[seatKey(letter,i)] = {status:"disponivel"}; }
    });
    MEZ_BASE.forEach(function(r){ for (var i=1;i<=r[4];i++){ d[seatKey(r[0],i)] = {status:"disponivel"}; } });
    ["LE","LD"].forEach(function(letter){
      for (var i=1;i<=ARM_ROWS*ARM_SEATS;i++){ d[seatKey(letter,i)] = {status:"disponivel"}; }
    });
    Object.keys(seed || {}).forEach(function(k){ d[k] = seed[k]; });
    return d;
  }

  function seatBtn(letter, i, extraClass){
    var k = seatKey(letter,i);
    var s = (data[k] && data[k].status) || "disponivel";
    return "<button class='seat "+s+(extraClass?" "+extraClass:"")+"' data-key='"+k+"'>"+i+"</button>";
  }

  function renderPlateiaRow(letter, l, fixed, r, total){
    var html = "<div class='row centered'><div class='row-label'>"+letter+"</div><div class='seats'>";
    for (var i=1;i<=total;i++){ html += seatBtn(letter, i, seatTypePlateia(letter, i, l, fixed, r)); }
    html += "</div><div class='row-label'>"+letter+"</div></div>";
    return html;
  }

  function renderOQRow(){
    var oDef = OQ_DEF.O, qDef = OQ_DEF.Q;
    var html = "<div class='row-pair'>";
    html += "<div class='row'><div class='row-label'>O</div><div class='seats'>";
    for (var i=1;i<=oDef[1];i++) html += seatBtn("O", i, "");
    html += "</div><div class='row-label'>O</div></div>";
    html += "<div class='row'><div class='row-label'>Q</div><div class='seats'>";
    for (var j=1;j<=qDef[1];j++) html += seatBtn("Q", j, "");
    html += "</div><div class='row-label'>Q</div></div>";
    html += "</div>";
    return html;
  }

  function renderMezanino(){
    var html = "<div class='mez-wrap'>";
    html += "<div class='mez-arm'><div class='mez-arm-label'>LE</div>";
    for (var rr=0; rr<ARM_ROWS; rr++){
      html += "<div class='seats'>";
      for (var c=1;c<=ARM_SEATS;c++){ html += seatBtn("LE", rr*ARM_SEATS+c, "extra"); }
      html += "</div>";
    }
    html += "</div>";
    html += "<div class='mez-base'>";
    MEZ_BASE.forEach(function(row){
      var letter=row[0], l=row[1], fixed=row[2], r=row[3], total=row[4];
      html += "<div class='row centered'><div class='row-label'>"+letter+"</div><div class='seats'>";
      for (var i=1;i<=total;i++){ html += seatBtn(letter, i, seatTypeMezBase(letter, i, l, fixed, r)); }
      html += "</div><div class='row-label'>"+letter+"</div></div>";
    });
    html += "</div>";
    html += "<div class='mez-arm'><div class='mez-arm-label'>LD</div>";
    for (var rr2=0; rr2<ARM_ROWS; rr2++){
      html += "<div class='seats'>";
      for (var c2=1;c2<=ARM_SEATS;c2++){ html += seatBtn("LD", rr2*ARM_SEATS+c2, "extra"); }
      html += "</div>";
    }
    html += "</div>";
    html += "</div>";
    return html;
  }

  function allSeatKeys(){
    var keys = [];
    PLATEIA.forEach(function(r){ for (var i=1;i<=r[4];i++) keys.push(seatKey(r[0],i)); });
    [1,2,3].forEach(function(i){ keys.push(seatKey("O",i)); keys.push(seatKey("Q",i)); });
    MEZ_BASE.forEach(function(r){ for (var i=1;i<=r[4];i++) keys.push(seatKey(r[0],i)); });
    for (var i=1;i<=ARM_ROWS*ARM_SEATS;i++){ keys.push(seatKey("LE",i)); keys.push(seatKey("LD",i)); }
    return keys;
  }

    if (editMode && isLoggedIn){

      });
    } else {
      document.body.classList.remove("editing");
    }

    document.body.appendChild(backdrop);

    document.getElementById("loginCancel").onclick = function(){ backdrop.remove(); };
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) backdrop.remove(); });

    document.getElementById("loginConfirm").onclick = function(){
      var email = document.getElementById("loginEmail").value;
      var pass = document.getElementById("loginPass").value;
      auth.signInWithEmailAndPassword(email, pass)
        .then(function(){ backdrop.remove(); editMode = true; render(); })
        .catch(function(){ document.getElementById("loginError").style.display = "block"; });
    };
  }

  function openPanel(key){
    var seat = data[key] || {status:"disponivel"};
    var backdrop = document.createElement("div");
    backdrop.className = "panel-backdrop";
    backdrop.innerHTML =
      "<div class='panel'>" +
      "<h3>Assento "+key.replace("-", "")+" — "+SESSIONS[currentSession].label+"</h3>" +
      "<div class='sub'>Atualize o status e, se quiser, os dados do responsável.</div>" +
      "<label>Status</label>" +
      "<select id='pStatus'>" +
      "<option value='disponivel'"+(seat.status==="disponivel"?" selected":"")+">Disponível</option>" +
      "<option value='reservado'"+(seat.status==="reservado"?" selected":"")+">Reservado</option>" +
      "<option value='vendido'"+(seat.status==="vendido"?" selected":"")+">Vendido</option>" +
      "</select>" +
      "<label>Nome do responsável</label>" +
      "<input id='pNome' value='"+(seat.nome||"")+"'/>" +
      "<label>Aluno</label>" +
      "<input id='pAluno' value='"+(seat.aluno||"")+"'/>" +
      "<label>Telefone</label>" +
      "<input id='pTel' value='"+(seat.tel||"")+"'/>" +
      "<div class='panel-actions'>" +
      "<button class='btn-cancel' id='pCancel'>Cancelar</button>" +
      "<button class='btn-save' id='pSave'>Salvar</button>" +
      "</div></div>";
    document.body.appendChild(backdrop);

    document.getElementById("pCancel").onclick = function(){ backdrop.remove(); };
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) backdrop.remove(); });
    document.getElementById("pSave").onclick = function(){
      var status = document.getElementById("pStatus").value;
      var nome = document.getElementById("pNome").value;
      var aluno = document.getElementById("pAluno").value;
      var tel = document.getElementById("pTel").value;
      data[key] = {status:status, nome:nome, aluno:aluno, tel:tel};
      backdrop.remove();
      saveToFirestore();
    };
  }

  function saveToFirestore(){
    var docId = SESSIONS[currentSession].doc;
    db.collection("sessions").doc(docId).set({seats: data}, {merge: false})
      .catch(function(err){ showToast("Não foi possível salvar: " + err.message); });
  }

  function showToast(msg){
    var t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);" +
      "background:#963c3a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;" +
      "z-index:100;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4);";
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3500);
  }

  function subscribeToSession(){
    if (unsubscribe){ unsubscribe(); unsubscribe = null; }
    var session = SESSIONS[currentSession];
    var ref = db.collection("sessions").doc(session.doc);

    unsubscribe = ref.onSnapshot(function(snap){
      if (snap.exists && snap.data().seats){
        data = snap.data().seats;
      } else {
        data = defaultData(session.seed);
        ref.set({seats: data});
      }
      render();
    }, function(err){
      data = defaultData(session.seed);
      render();
      showToast("Erro ao conectar: " + err.message);
    });
  }

  auth.onAuthStateChanged(function(){ render(); });

  subscribeToSession();
})();
</script>
</body>
</html>
